<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<meta name="description" content="A simple offline checklist that saves to your browser.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Checklist">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --danger: #c02f2f;
    --done: #8b929c;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --surface: #1c2027;
      --border: #2c323b;
      --text: #e8eaed;
      --muted: #98a1ae;
      --accent: #5b8dfb;
      --accent-text: #0f1216;
      --danger: #f07171;
      --done: #737c88;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 32px 16px 80px;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ---- header ---- */

  .head {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .title {
    width: 100%;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: 600 22px/1.3 inherit;
    padding: 4px 6px;
    margin: 0 0 12px -6px;
  }

  .title:hover { border-color: var(--border); }

  .title:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg);
  }

  .meter {
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .meter > span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width .18s ease;
  }

  .count {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---- add form ---- */

  .add {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .add input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: inherit;
    font: inherit;
  }

  .add input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: transparent;
  }

  button {
    font: inherit;
    cursor: pointer;
  }

  .btn {
    padding: 10px 16px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 500;
    white-space: nowrap;
  }

  .btn:hover { filter: brightness(1.07); }

  .btn:focus-visible,
  .link:focus-visible,
  .filter:focus-visible,
  .icon:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- filters ---- */

  .filters {
    display: flex;
    gap: 4px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }

  .filter {
    padding: 5px 12px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
  }

  .filter:hover { background: var(--bg); }

  .filter[aria-pressed="true"] {
    background: var(--bg);
    border-color: var(--border);
    color: var(--text);
    font-weight: 500;
  }

  /* ---- list ---- */

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  .item:last-child { border-bottom: 0; }

  .item.dragging { opacity: .4; }

  .item.drop-target { border-top: 2px solid var(--accent); }

  .grip {
    color: var(--muted);
    cursor: grab;
    padding: 0 2px;
    line-height: 1;
    user-select: none;
    flex: none;
  }

  .item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex: none;
    cursor: pointer;
  }

  .text {
    flex: 1;
    min-width: 0;
    cursor: text;
    overflow-wrap: anywhere;
  }

  .item.done .text {
    color: var(--done);
    text-decoration: line-through;
  }

  .edit {
    flex: 1;
    min-width: 0;
    padding: 4px 8px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--bg);
    color: inherit;
    font: inherit;
  }

  .edit:focus { outline: none; }

  .icon {
    flex: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1;
    font-size: 15px;
    opacity: 0;
  }

  .item:hover .icon,
  .item:focus-within .icon { opacity: 1; }

  .icon:hover { background: var(--bg); color: var(--danger); }

  @media (hover: none) {
    .icon { opacity: 1; }
  }

  .empty {
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
  }

  /* ---- footer ---- */

  .foot {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
  }

  .foot:empty { display: none; }

  .link {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    padding: 4px;
    border-radius: 6px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .link:hover { color: var(--danger); }

  .hint {
    margin: 14px 4px 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }

  kbd {
    font: inherit;
    font-size: 12px;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    background: var(--surface);
  }

  /* ---- undo toast ---- */

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
    font-size: 14px;
    max-width: calc(100vw - 32px);
  }

  .toast[hidden] { display: none; }

  .toast button {
    border: 0;
    background: transparent;
    color: var(--accent);
    font-weight: 600;
    padding: 2px 4px;
    border-radius: 4px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

<main class="app">
  <div class="card">
    <div class="head">
      <input id="title" class="title" value="Checklist" aria-label="Checklist title" maxlength="80" autocomplete="off">
      <div class="meter" role="progressbar" id="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress">
        <span id="meter-fill"></span>
      </div>
      <p class="count" id="count">Nothing here yet</p>
    </div>

    <form class="add" id="add-form">
      <input id="new-item" placeholder="Add an item…" aria-label="New item" autocomplete="off" maxlength="500">
      <button class="btn" type="submit">Add</button>
    </form>

    <div class="filters" id="filters">
      <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="filter" type="button" data-filter="active" aria-pressed="false">To do</button>
      <button class="filter" type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="list"></ul>
    <p class="empty" id="empty" hidden></p>

    <div class="foot" id="foot"></div>
  </div>

  <p class="hint">
    Double-click an item to edit · <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> to reorder · saved in this browser
  </p>
</main>

<div class="toast" id="toast" hidden>
  <span id="toast-msg"></span>
  <button type="button" id="undo">Undo</button>
</div>

<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<script>
(function () {
  'use strict';

  var KEY = 'daftplanet.checklist.v1';

  var state = { title: 'Checklist', items: [], filter: 'all' };
  var undoSnapshot = null;
  var toastTimer = null;
  var editingId = null;
  var dragId = null;

  var el = {
    title: document.getElementById('title'),
    meter: document.getElementById('meter'),
    fill: document.getElementById('meter-fill'),
    count: document.getElementById('count'),
    form: document.getElementById('add-form'),
    input: document.getElementById('new-item'),
    filters: document.getElementById('filters'),
    list: document.getElementById('list'),
    empty: document.getElementById('empty'),
    foot: document.getElementById('foot'),
    toast: document.getElementById('toast'),
    toastMsg: document.getElementById('toast-msg'),
    undo: document.getElementById('undo'),
    live: document.getElementById('live')
  };

  /* ---------- persistence ---------- */

  function load() {
    var raw;
    try {
      raw = window.localStorage.getItem(KEY);
    } catch (e) {
      return; // private mode / blocked storage
    }
    if (!raw) return;

    var saved;
    try {
      saved = JSON.parse(raw);
    } catch (e) {
      return; // corrupt payload, start fresh
    }
    if (!saved || typeof saved !== 'object') return;

    if (typeof saved.title === 'string') state.title = saved.title;
    if (saved.filter === 'active' || saved.filter === 'done') state.filter = saved.filter;

    if (Array.isArray(saved.items)) {
      state.items = saved.items
        .filter(function (it) { return it && typeof it.text === 'string'; })
        .map(function (it) {
          return {
            id: typeof it.id === 'string' ? it.id : newId(),
            text: it.text,
            done: it.done === true
          };
        });
    }
  }

  function save() {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      /* storage full or unavailable — the app still works for this session */
    }
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function indexOf(id) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) return i;
    }
    return -1;
  }

  /* ---------- rendering ---------- */

  function visible() {
    return state.items.filter(function (it) {
      if (state.filter === 'active') return !it.done;
      if (state.filter === 'done') return it.done;
      return true;
    });
  }

  function render() {
    var total = state.items.length;
    var done = state.items.filter(function (it) { return it.done; }).length;
    var pct = total ? Math.round((done / total) * 100) : 0;

    el.fill.style.width = pct + '%';
    el.meter.setAttribute('aria-valuenow', String(pct));
    el.count.textContent = total
      ? done + ' of ' + total + ' done'
      : 'Nothing here yet';

    Array.prototype.forEach.call(el.filters.children, function (btn) {
      btn.setAttribute('aria-pressed', String(btn.dataset.filter === state.filter));
    });

    el.list.textContent = '';
    var rows = visible();
    rows.forEach(function (item) { el.list.appendChild(row(item)); });

    if (rows.length) {
      el.empty.hidden = true;
    } else {
      el.empty.hidden = false;
      el.empty.textContent = !total
        ? 'Add your first item above.'
        : state.filter === 'done'
          ? 'Nothing checked off yet.'
          : 'All done — nice.';
    }

    renderFoot(total, done);
  }

  function row(item) {
    var li = document.createElement('li');
    li.className = 'item' + (item.done ? ' done' : '');
    li.dataset.id = item.id;
    li.draggable = true;
    li.tabIndex = -1;

    var grip = document.createElement('span');
    grip.className = 'grip';
    grip.setAttribute('aria-hidden', 'true');
    grip.textContent = '⠿';
    li.appendChild(grip);

    var box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = item.done;
    box.id = 'chk-' + item.id;
    box.addEventListener('change', function () { toggle(item.id); });
    li.appendChild(box);

    if (editingId === item.id) {
      li.appendChild(editor(item));
      return li;
    }

    var label = document.createElement('label');
    label.className = 'text';
    label.setAttribute('for', box.id);
    label.textContent = item.text;
    label.addEventListener('dblclick', function (ev) {
      ev.preventDefault();
      startEdit(item.id);
    });
    li.appendChild(label);

    var edit = iconButton('✎', 'Edit “' + item.text + '”', function () { startEdit(item.id); });
    var del = iconButton('✕', 'Delete “' + item.text + '”', function () { remove(item.id); });
    li.appendChild(edit);
    li.appendChild(del);

    return li;
  }

  function editor(item) {
    var input = document.createElement('input');
    input.className = 'edit';
    input.value = item.text;
    input.maxLength = 500;
    input.setAttribute('aria-label', 'Edit item');

    function commit() {
      if (editingId !== item.id) return;
      var text = input.value.trim();
      editingId = null;
      var i = indexOf(item.id);
      if (i === -1) { render(); return; }
      if (text) {
        state.items[i].text = text;
      } else {
        state.items.splice(i, 1);
        announce('Item removed');
      }
      save();
      render();
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        commit();
      } else if (ev.key === 'Escape') {
        ev.preventDefault();
        editingId = null;
        render();
      }
    });

    window.setTimeout(function () {
      input.focus();
      input.select();
    }, 0);

    return input;
  }

  function iconButton(glyph, label, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'icon';
    b.textContent = glyph;
    b.setAttribute('aria-label', label);
    b.title = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function renderFoot(total, done) {
    el.foot.textContent = '';
    if (!total) return;

    if (done) {
      el.foot.appendChild(
        linkButton('Clear ' + done + ' completed', function () {
          snapshot();
          state.items = state.items.filter(function (it) { return !it.done; });
          save();
          render();
          toast(done + ' item' + (done === 1 ? '' : 's') + ' cleared');
        })
      );
    } else {
      el.foot.appendChild(document.createElement('span'));
    }

    el.foot.appendChild(
      linkButton('Delete all', function () {
        snapshot();
        state.items = [];
        save();
        render();
        toast('List cleared');
      })
    );
  }

  function linkButton(text, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'link';
    b.textContent = text;
    b.addEventListener('click', onClick);
    return b;
  }

  /* ---------- actions ---------- */

  function add(text) {
    state.items.push({ id: newId(), text: text, done: false });
    save();
    render();
  }

  function toggle(id) {
    var i = indexOf(id);
    if (i === -1) return;
    state.items[i].done = !state.items[i].done;
    save();
    render();
  }

  function remove(id) {
    var i = indexOf(id);
    if (i === -1) return;
    snapshot();
    var text = state.items[i].text;
    state.items.splice(i, 1);
    save();
    render();
    toast('Deleted “' + text + '”');
  }

  function startEdit(id) {
    editingId = id;
    render();
  }

  function move(id, delta) {
    var from = indexOf(id);
    if (from === -1) return;
    var to = from + delta;
    if (to < 0 || to >= state.items.length) return;
    var moved = state.items.splice(from, 1)[0];
    state.items.splice(to, 0, moved);
    save();
    render();
    refocus(id);
    announce('Moved to position ' + (to + 1) + ' of ' + state.items.length);
  }

  function reorder(fromId, toId, after) {
    var from = indexOf(fromId);
    if (from === -1 || fromId === toId) return;
    var moved = state.items.splice(from, 1)[0];
    var to = indexOf(toId);
    if (to === -1) {
      state.items.push(moved);
    } else {
      state.items.splice(after ? to + 1 : to, 0, moved);
    }
    save();
    render();
  }

  function refocus(id) {
    var li = el.list.querySelector('[data-id="' + id + '"]');
    if (li) li.focus();
  }

  /* ---------- undo ---------- */

  function snapshot() {
    undoSnapshot = state.items.map(function (it) {
      return { id: it.id, text: it.text, done: it.done };
    });
  }

  function toast(message) {
    el.toastMsg.textContent = message;
    el.toast.hidden = false;
    announce(message);
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(hideToast, 7000);
  }

  function hideToast() {
    el.toast.hidden = true;
    undoSnapshot = null;
  }

  el.undo.addEventListener('click', function () {
    if (!undoSnapshot) return;
    state.items = undoSnapshot;
    undoSnapshot = null;
    save();
    render();
    hideToast();
    announce('Undone');
  });

  function announce(message) {
    el.live.textContent = message;
  }

  /* ---------- events ---------- */

  el.form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = el.input.value.trim();
    if (!text) return;
    add(text);
    el.input.value = '';
    el.input.focus();
  });

  el.title.addEventListener('input', function () {
    state.title = el.title.value;
    save();
  });

  el.title.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      el.title.blur();
    }
  });

  el.filters.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.filter');
    if (!btn) return;
    state.filter = btn.dataset.filter;
    save();
    render();
  });

  el.list.addEventListener('keydown', function (ev) {
    var li = ev.target.closest('.item');
    if (!li) return;

    if (ev.altKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
      ev.preventDefault();
      move(li.dataset.id, ev.key === 'ArrowUp' ? -1 : 1);
    }
  });

  /* drag to reorder */

  el.list.addEventListener('dragstart', function (ev) {
    var li = ev.target.closest('.item');
    if (!li) return;
    dragId = li.dataset.id;
    li.classList.add('dragging');
    ev.dataTransfer.effectAllowed = 'move';
    // Firefox needs data set for the drag to start
    try { ev.dataTransfer.setData('text/plain', dragId); } catch (e) {}
  });

  el.list.addEventListener('dragover', function (ev) {
    if (!dragId) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    var li = ev.target.closest('.item');
    clearDropMarks();
    if (li && li.dataset.id !== dragId) li.classList.add('drop-target');
  });

  el.list.addEventListener('drop', function (ev) {
    if (!dragId) return;
    ev.preventDefault();
    var li = ev.target.closest('.item');
    clearDropMarks();
    if (li) {
      var box = li.getBoundingClientRect();
      var after = ev.clientY > box.top + box.height / 2;
      reorder(dragId, li.dataset.id, after);
    }
    dragId = null;
  });

  el.list.addEventListener('dragend', function () {
    clearDropMarks();
    var dragging = el.list.querySelector('.dragging');
    if (dragging) dragging.classList.remove('dragging');
    dragId = null;
  });

  function clearDropMarks() {
    Array.prototype.forEach.call(el.list.querySelectorAll('.drop-target'), function (n) {
      n.classList.remove('drop-target');
    });
  }

  /* keep tabs in sync */

  window.addEventListener('storage', function (ev) {
    if (ev.key !== KEY) return;
    editingId = null;
    load();
    el.title.value = state.title;
    render();
  });

  /* ---------- boot ---------- */

  load();
  el.title.value = state.title;
  document.title = state.title ? state.title : 'Checklist';
  el.title.addEventListener('input', function () {
    document.title = el.title.value ? el.title.value : 'Checklist';
  });
  render();
})();
</script>

</body>
</html>
